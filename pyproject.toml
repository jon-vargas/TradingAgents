[build-system]
requires = ["setuptools>=80.9.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tradingagents"
version = "0.1.0"
description = "Multi-Agent LLM Financial Trading & Research Framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # LLM / LangChain
    "langchain-core>=0.3.81",
    "langchain-openai>=0.3.23",
    "langchain-experimental>=0.3.4",
    "langchain-anthropic>=0.3.15",
    "langchain-google-genai>=2.1.5",
    "langgraph>=0.4.8",
    "langgraph-checkpoint>=2.1.0,<4.0.0",
    "langgraph-checkpoint-sqlite>=2.0.6,<3.0.0",
    "perplexityai>=0.43.0",
    "openai>=1.0.0",
    # Data
    "pandas>=2.3.0",
    "numpy>=1.24.0",
    "yfinance>=0.2.63",
    "stockstats>=0.6.5",
    "finnhub-python>=2.4.23",
    "eodhd>=1.0.32",
    "akshare>=1.16.98",
    "tushare>=1.4.21",
    # News / social
    "praw>=7.8.1",
    "feedparser>=6.0.11",
    "requests>=2.32.4",
    "parsel>=1.10.0",
    # Web UI
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "jinja2>=3.1.0",
    "python-multipart>=0.0.9",
    "aiofiles>=24.1.0",
    # PDF / reports
    "weasyprint>=60.0",
    "tiktoken>=0.5.0",
    # CLI
    "typer>=0.9.0",
    "rich>=14.0.0",
    "questionary>=2.1.0",
    # Utilities
    "python-dotenv>=1.0.0",
    "python-dateutil>=2.8.0",
    "pytz>=2025.2",
    "tqdm>=4.67.1",
    "typing-extensions>=4.14.0",
    "setuptools>=80.9.0",
    # Storage
    "chromadb>=1.0.12",
]

[project.scripts]
tradingagents = "cli.main:app"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
